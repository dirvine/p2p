# P2P Foundation Workspace
# Hybrid Architecture: Tauri Desktop + Flutter Mobile/Web + Shared Rust Core

[workspace]
resolver = "2"
members = [
    "crates/p2p-core",           # Core P2P library (publishable to crates.io)
    "crates/p2p-ffi",            # FFI bindings for Flutter
    "crates/p2p-cli",            # CLI tools and utilities
    "apps/desktop-tauri/src-tauri", # Tauri desktop application
    "test-app",                  # Test application
    "examples/*",                # Example applications
]

[workspace.package]
version = "0.2.3"
edition = "2021"
authors = ["David Irvine <david@maidsafe.net>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/dirvine/p2p"
repository = "https://github.com/dirvine/p2p"

[workspace.dependencies]
# Shared dependencies across all workspace members
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
uuid = { version = "1.0", features = ["v4"] }

# P2P and networking
quinn = "0.11"
rustls = "0.23"
rcgen = "0.13"

# Cryptography
ed25519-dalek = { version = "1.0", features = ["rand"] }
rand = "0.7"
sha2 = "0.10"

# Utilities
bytes = "1.0"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"

# Workspace-level profiles
[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 0

# For faster builds during development
[profile.dev.package."*"]
opt-level = 2

# Package-specific optimizations
[profile.release.package.tauri]
opt-level = 3