# P2P Foundation Workspace
# Hybrid Architecture: Tauri Desktop + Flutter Mobile/Web + Shared Rust Core

[workspace]
resolver = "2"
members = [
    "crates/p2p-core",           # Core P2P library (publishable to crates.io)
    "crates/p2p-ffi",            # FFI bindings for Flutter
    "crates/p2p-cli",            # CLI tools and utilities
    "crates/ant-test-suite",     # Comprehensive test suite with data integrity verification
    "apps/saorsa/src-tauri",     # Tauri desktop application
    "apps/saorsa-terminal-chat", # Terminal chat application
    "apps/saorsa-network-tester",# Network testing tool
    "test-app",                  # Test application
    # "examples/*",                # Example applications - temporarily disabled for Tauri testing
]

[workspace.package]
version = "0.2.6"
edition = "2021"
authors = ["David Irvine <saorsalabs@gmail.com>"]
license = "AGPL-3.0-or-later"
homepage = "https://github.com/dirvine/p2p"
repository = "https://github.com/dirvine/p2p"

[workspace.dependencies]
# Shared dependencies across all workspace members
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-big-array = "0.5"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
uuid = { version = "1.0", features = ["v4"] }

# P2P and networking
quinn = "0.11"
rustls = "0.23"
rcgen = "0.13"

# NAT traversal and networking capabilities now handled directly by quinn

# Cryptography  
ed25519-dalek = { version = "1.0", features = ["rand"] }
rand_core = "0.5"
rand = "0.7"
sha2 = "0.10"
aes-gcm = "0.10"
hkdf = "0.12"

# Post-quantum cryptography
ml-kem = "0.2"           # FIPS 203 KEM
ml-dsa = "0.1.0-pre.2"   # FIPS 204 signatures (prerelease)
frost-ed25519 = "2.0.0-rc.0"    # Threshold signatures
shamir = "2.0"           # Secret sharing
vsss-rs = "3.0"          # Verifiable secret sharing

# Utilities
bytes = "1.0"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
toml = "0.8"
shellexpand = "3.1"

# Three-word networking addresses
three-word-networking = "0.1.0"

# Workspace-level profiles
[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 0

# For faster builds during development
[profile.dev.package."*"]
opt-level = 2

# Package-specific optimizations
[profile.release.package.tauri]
opt-level = 3