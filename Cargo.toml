[package]
name = "p2p-foundation"
version = "0.1.0"
edition = "2021"
authors = ["David Irvine <david@yourdomain.com>"]
description = "A next-generation P2P networking foundation with built-in AI capabilities"
documentation = "https://docs.rs/p2p-foundation"
homepage = "https://github.com/dirvine/p2p"
repository = "https://github.com/dirvine/p2p"
license = "MIT OR Apache-2.0"
keywords = ["p2p", "networking", "quic", "ipv6", "mcp"]
categories = ["network-programming", "asynchronous"]

[dependencies]
# P2P Networking
libp2p = { version = "0.54", features = [
    "kad", 
    "gossipsub", 
    "quic", 
    "tcp",
    "relay", 
    "dcutr", 
    "identify", 
    "noise", 
    "yamux",
    "mdns",
    "request-response"
] }

# QUIC Implementation
quinn = "0.11"
rustls = { version = "0.23", features = ["dangerous_configuration"] }
rcgen = "0.13"

# Async Runtime
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# MCP Implementation
jsonrpc-core = "18.0"
jsonrpc-derive = "18.0"
jsonrpc-pubsub = "18.0"

# Cryptography
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
sha2 = "0.10"
constant_time_eq = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
bytes = "1.5"

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Logging and Metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus = { version = "0.13", optional = true }

# Utilities
uuid = { version = "1.10", features = ["v4", "serde"] }
rand = "0.8"
parking_lot = "0.12"
dashmap = "6.0"
lru = "0.12"

# Network Utilities
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"
pnet = "0.35"
etherparse = "0.15"

# Configuration
config = { version = "0.14", features = ["toml"] }
clap = { version = "4.5", features = ["derive"], optional = true }

# Testing
proptest = { version = "1.4", optional = true }
criterion = { version = "0.5", optional = true }

[dev-dependencies]
tempfile = "3.10"
pretty_assertions = "1.4"
serial_test = "3.1"

[features]
default = ["cli"]
cli = ["clap"]
metrics = ["prometheus"]
bench = ["criterion"]
test-utils = ["proptest"]

[[bin]]
name = "p2p-node"
required-features = ["cli"]

[[example]]
name = "basic_node"

[[example]]
name = "dht_storage"

[[example]]
name = "mcp_service"

[[bench]]
name = "dht_benchmark"
harness = false
required-features = ["bench"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 0

[workspace]
members = [
    ".",
    "examples/*",
]