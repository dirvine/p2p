[package]
name = "p2p-foundation"
version = "0.1.0"
edition = "2021"
authors = ["David Irvine <david@yourdomain.com>"]
description = "A next-generation P2P networking foundation with built-in AI capabilities"
documentation = "https://docs.rs/p2p-foundation"
homepage = "https://github.com/dirvine/p2p"
repository = "https://github.com/dirvine/p2p"
license = "MIT OR Apache-2.0"
keywords = ["p2p", "networking", "quic", "ipv6", "mcp"]
categories = ["network-programming", "asynchronous"]

[dependencies]
# Async Runtime (minimal for now)
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.0"

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1.0", features = ["v4"] }

# Configuration
clap = { version = "4.4", features = ["derive"], optional = true }

# For testing framework
criterion = { version = "0.4", optional = true }

[dev-dependencies]
tempfile = "3.10"
pretty_assertions = "1.4"
serial_test = "3.1"

[features]
default = ["cli"]
cli = ["clap"]
bench = ["criterion"]

[[bin]]
name = "p2p-node"
required-features = ["cli"]

[[example]]
name = "basic_node"

[[example]]
name = "dht_storage"

[[example]]
name = "mcp_service"

[[bench]]
name = "dht_benchmark"
harness = false
required-features = ["bench"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 0

[workspace]
members = [
    ".",
    "examples/*",
]