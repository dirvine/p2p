# Clippy configuration for P2P Foundation
# Security-focused configuration for production code

# Disallow dangerous methods
disallowed-methods = [
    { path = "std::result::Result::unwrap", reason = "Use proper error handling with ? operator or match" },
    { path = "std::option::Option::unwrap", reason = "Use if let, match, or unwrap_or alternatives" },
    { path = "std::result::Result::expect", reason = "Use proper error handling in production code" },
]

# Allow unwrap in tests only
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

# Security thresholds
cognitive-complexity-threshold = 15
too-many-arguments-threshold = 8
type-complexity-threshold = 100
EOF < /dev/null