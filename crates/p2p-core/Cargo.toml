[package]
name = "saorsa-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Saorsa - Core P2P networking library with DHT, QUIC transport, three-word addresses, and MCP integration"
keywords = ["p2p", "networking", "dht", "quic", "decentralized"]
categories = ["network-programming", "asynchronous", "cryptography"]
readme = "../../README.md"
documentation = "https://docs.rs/saorsa-core"
include = [
    "src/**/*",
    "Cargo.toml",
    "../../README.md",
    "../../LICENSE-AGPL-3.0",
    "../../LICENSE-COMMERCIAL",
]

[dependencies]
# Workspace dependencies
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-big-array.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
ant-quic.workspace = true
# four-word-networking = "1.2"  # TODO: Real crate not available yet
ed25519-dalek.workspace = true
rand.workspace = true
rand_core.workspace = true
sha2.workspace = true
rand_chacha = "0.3"
x25519-dalek = "2.0"
bytes.workspace = true
hex.workspace = true
chrono.workspace = true
base64.workspace = true

# Direct quinn networking - iroh removed for simplification

# Core-specific dependencies
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5.0"
fastrand = "2.0"
reqwest = "0.11"
jsonwebtoken = "9.2"

# Identity system dependencies
aes-gcm.workspace = true
blake3 = "1.5"
hkdf.workspace = true
argon2 = "0.5"
hmac = "0.12"

# Git content addressing dependencies
bincode = "1.3"
lru = "0.12"

# Post-quantum cryptography (temporarily disabled)
# ml-kem.workspace = true
# ml-dsa.workspace = true
# frost-ed25519.workspace = true
# shamir.workspace = true
# vsss-rs.workspace = true

# Optional CLI dependencies
clap = { version = "4.4", features = ["derive"], optional = true }
warp = { version = "0.3", optional = true }
mime_guess = { version = "2.0", optional = true }
include_dir = { version = "0.7", optional = true }

[dev-dependencies]
tempfile = "3.10"
pretty_assertions = "1.4"
serial_test = "3.1"
criterion = { version = "0.4", features = ["html_reports"] }
clap = { version = "4.4", features = ["derive"] }

[features]
default = ["dht", "mcp", "four-word-addresses"]
# Feature flags for different capabilities
dht = []
mcp = []
four-word-addresses = []
quantum-resistant = []
threshold = []
cli = ["clap", "warp", "mime_guess", "include_dir"]
# Commercial license features
commercial = []
agpl-compliance = []

[[bench]]
name = "dht_benchmark"
harness = false

[[bench]]
name = "security_benchmark"
harness = false

[[bench]]
name = "production_benchmark"
harness = false

# Platform-specific dependencies for secure memory management
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["memoryapi"] }
