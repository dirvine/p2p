[package]
name = "ant-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Ant Network - Core P2P networking library with DHT, QUIC transport, three-word addresses, and MCP integration"
keywords = ["p2p", "networking", "dht", "quic", "decentralized"]
categories = ["network-programming", "asynchronous", "cryptography"]
readme = "README.md"

[dependencies]
# Workspace dependencies
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
quinn.workspace = true
rustls.workspace = true
rcgen.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
sha2.workspace = true
bytes.workspace = true
hex.workspace = true
chrono.workspace = true
base64.workspace = true

# Core-specific dependencies
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5.0"
fastrand = "2.0"
reqwest = "0.11"
jsonwebtoken = "9.2"

# Identity system dependencies
aes-gcm = "0.10"
blake3 = "1.5"

# Optional CLI dependencies
clap = { version = "4.4", features = ["derive"], optional = true }
warp = { version = "0.3", optional = true }
mime_guess = { version = "2.0", optional = true }
include_dir = { version = "0.7", optional = true }

[dev-dependencies]
tempfile = "3.10"
pretty_assertions = "1.4"
serial_test = "3.1"
criterion = { version = "0.4", features = ["html_reports"] }

[features]
default = ["dht", "mcp", "tunneling", "three-word-addresses"]
# Feature flags for different capabilities
dht = []
mcp = []
tunneling = []
three-word-addresses = []
cli = ["clap", "warp", "mime_guess", "include_dir"]

[[bench]]
name = "dht_benchmark"
harness = false

[[bench]]
name = "security_benchmark"
harness = false

[[bench]]
name = "production_benchmark"
harness = false