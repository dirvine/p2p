[package]
name = "p2p-ffi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "FFI bindings for P2P Foundation - enables Flutter and other language integration"
keywords = ["p2p", "ffi", "flutter", "dart", "bindings"]
categories = ["api-bindings", "network-programming"]

[lib]
name = "p2p_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
# Core P2P library
saorsa-core = { path = "../p2p-core" }

# Workspace dependencies
tokio.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

# FFI-specific dependencies
libc = "0.2"
once_cell = "1.19"
parking_lot = "0.12"

# Dart FFI support (disabled by default due to compilation complexity)
# dart-sys = { version = "4.1", optional = true }

# Optional async runtime for FFI callbacks (already included above)

[features]
default = []
# dart = ["dart-sys"]
# flutter = ["dart"]

# Mobile platform specific features
android = []
ios = []