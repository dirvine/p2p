[package]
name = "p2p-integration-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Core dependencies
saorsa-core = { path = "../p2p-core" }
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Test-specific dependencies
tempfile = "3.10"
serial_test = "3.1"
pretty_assertions = "1.4"
criterion = { version = "0.4", features = ["html_reports"] }
rand.workspace = true
uuid.workspace = true

# Monitoring and analysis
prometheus = "0.13"
metrics = "0.21"
metrics-exporter-prometheus = "0.12"

# Network simulation
surge-ping = "0.8"
iperf3 = "0.1"  # For bandwidth testing

[[test]]
name = "multi_node"
path = "src/multi_node.rs"

[[test]]
name = "churn_simulation"
path = "src/churn_simulation.rs"

[[test]]
name = "attack_scenarios"
path = "src/attack_scenarios.rs"

[[test]]
name = "performance_benchmarks"
path = "src/performance_benchmarks.rs"

[[test]]
name = "chaos_testing"
path = "src/chaos_testing.rs"