[package]
name = "saorsa"
version = "0.2.3"
description = "Saorsa - P2P messaging with comprehensive contact management, identity persistence, and AI integration"
authors = ["David Irvine <david@maidsafe.net>"]
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/dirvine/p2p"
repository = "https://github.com/dirvine/p2p"
documentation = "https://github.com/dirvine/p2p/tree/main/apps/desktop-tauri"
readme = "README.md"
keywords = ["p2p", "messaging", "privacy", "decentralized", "tauri"]
categories = ["gui", "network-programming", "cryptography"]
include = [
    "src/**/*",
    "Cargo.toml",
    "build.rs",
    "tauri.conf.json",
    "icons/**/*",
    "README.md"
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "saorsa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "saorsa"
path = "src/bin/saorsa.rs"

[features]
default = []
bundle-frontend = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Core P2P library (published on crates.io)
ant-core = "0.1.8"

# Tauri framework  
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Utilities
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4"] }
dirs = "5.0"

# Cryptography and encoding
base64 = "0.22"
ed25519-dalek = { version = "1.0", features = ["serde", "rand"] }
bincode = "1.3"
aes-gcm = "0.10"
sha2 = "0.10"
rand.workspace = true

