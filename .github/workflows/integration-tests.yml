name: Comprehensive Integration Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run nightly integration tests
    - cron: '0 2 * * *'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  INTEGRATION_TEST_TIMEOUT: 600

jobs:
  integration-tests:
    name: Integration Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    strategy:
      matrix:
        rust-version: [stable, beta]
        test-category: 
          - network
          - storage  
          - security
          - end-to-end
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust-version }}
        components: rustfmt, clippy
        
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
          
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config libssl-dev \
          libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
          librsvg2-dev libglib2.0-dev
        
    - name: Build project
      run: cargo build --release --all-features
      
    - name: Run Network Integration Tests
      if: matrix.test-category == 'network'
      run: |
        cargo test --test network_integration_comprehensive_test \
          --release -- --nocapture --test-threads=1
          
    - name: Run Storage Integration Tests  
      if: matrix.test-category == 'storage'
      run: |
        cargo test --test storage_integration_comprehensive_test \
          --release -- --nocapture --test-threads=1
          
    - name: Run Security Integration Tests
      if: matrix.test-category == 'security'  
      run: |
        cargo test --test security_integration_comprehensive_test \
          --release -- --nocapture --test-threads=1
          
    - name: Run End-to-End Scenario Tests
      if: matrix.test-category == 'end-to-end'
      run: |
        cargo test --test end_to_end_scenarios_test \
          --release -- --nocapture --test-threads=1
          
    - name: Generate Test Report
      if: always()
      run: |
        if [ -f integration_test_report.md ]; then
          echo "## Integration Test Report - ${{ matrix.test-category }}" >> $GITHUB_STEP_SUMMARY
          cat integration_test_report.md >> $GITHUB_STEP_SUMMARY
        fi
        
    - name: Upload Test Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: integration-test-results-${{ matrix.rust-version }}-${{ matrix.test-category }}
        path: |
          integration_test_report.md
          target/debug/test-results/
          
  comprehensive-test-suite:
    name: Full Integration Test Suite
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.event_name == 'schedule' || github.event_name == 'push'
    timeout-minutes: 60
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
        
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/
        key: ${{ runner.os }}-cargo-comprehensive-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config libssl-dev \
          libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
          librsvg2-dev libglib2.0-dev
        
    - name: Build project with all features
      run: cargo build --release --all-features
      
    - name: Run Complete Integration Test Suite
      run: |
        cargo test --test integration_test_runner --release -- \
          --nocapture run_all_tests
          
    - name: Performance Benchmarks
      run: |
        cargo bench --bench integration_benchmarks || true
        
    - name: Generate Comprehensive Report
      run: |
        echo "# Comprehensive Integration Test Results" > comprehensive_report.md
        echo "Generated: $(date)" >> comprehensive_report.md
        echo "" >> comprehensive_report.md
        
        if [ -f integration_test_report.md ]; then
          cat integration_test_report.md >> comprehensive_report.md
        fi
        
        echo "## System Information" >> comprehensive_report.md
        echo "- OS: $(uname -a)" >> comprehensive_report.md
        echo "- Rust: $(rustc --version)" >> comprehensive_report.md
        echo "- Cargo: $(cargo --version)" >> comprehensive_report.md
        
    - name: Upload Comprehensive Results
      uses: actions/upload-artifact@v4
      with:
        name: comprehensive-integration-results
        path: |
          comprehensive_report.md
          integration_test_report.md
          target/criterion/
          
    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          if (fs.existsSync('comprehensive_report.md')) {
            const report = fs.readFileSync('comprehensive_report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Comprehensive Integration Test Results\n\n' + report
            });
          }
          
  performance-regression-check:
    name: Performance Regression Detection
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      
    - name: Checkout base branch
      run: git checkout ${{ github.base_ref }}
      
    - name: Run baseline performance tests
      run: |
        cargo build --release
        cargo test --test end_to_end_scenarios_test test_network_performance_benchmarks \
          --release -- --nocapture > baseline_perf.txt || true
          
    - name: Checkout PR branch
      run: git checkout ${{ github.head_ref }}
      
    - name: Run PR performance tests
      run: |
        cargo build --release  
        cargo test --test end_to_end_scenarios_test test_network_performance_benchmarks \
          --release -- --nocapture > pr_perf.txt || true
          
    - name: Compare Performance
      run: |
        echo "# Performance Comparison" > perf_comparison.md
        echo "## Baseline (base branch)" >> perf_comparison.md
        if [ -f baseline_perf.txt ]; then
          echo '```' >> perf_comparison.md
          tail -20 baseline_perf.txt >> perf_comparison.md
          echo '```' >> perf_comparison.md
        fi
        echo "## PR Branch" >> perf_comparison.md
        if [ -f pr_perf.txt ]; then
          echo '```' >> perf_comparison.md
          tail -20 pr_perf.txt >> perf_comparison.md
          echo '```' >> perf_comparison.md
        fi
        
    - name: Upload Performance Comparison
      uses: actions/upload-artifact@v4
      with:
        name: performance-comparison
        path: perf_comparison.md
