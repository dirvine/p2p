name: Deploy P2P Apps

on:
  push:
    tags:
      - 'v*'      # Deploy on version tags (e.g., v1.0.0)
    branches:
      - main      # Auto-deploy main branch to beta
  pull_request:
    branches:
      - main      # Test builds on PRs
  workflow_dispatch:  # Manual trigger
    inputs:
      app_name:
        description: 'Specific app to deploy (or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - saorsa
      platform:
        description: 'Platform to deploy to'
        required: true
        default: 'desktop'
        type: choice
        options:
          - desktop
          - macos
          - windows
          - linux
      deployment_type:
        description: 'Deployment type'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - production
          - dev_build

env:
  RUST_VERSION: 'stable'
  TAURI_VERSION: '2.0'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      saorsa: ${{ steps.changes.outputs.saorsa }}
      terminal-apps: ${{ steps.changes.outputs.terminal-apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for change detection
          
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            rust:
              - 'src/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            saorsa:
              - 'apps/saorsa/**'
            terminal-apps:
              - 'apps/saorsa-terminal-chat/**'
              - 'apps/saorsa-network-tester/**'

  build-terminal-apps:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.terminal-apps == 'true' || github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
          
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: terminal-apps-${{ runner.os }}
          workspaces: "."
          
      - name: Build terminal applications
        run: |
          cargo build --release -p saorsa-terminal-chat -p saorsa-network-tester
          
      - name: Upload terminal app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: terminal-apps
          path: |
            target/release/saorsa-terminal-chat
            target/release/saorsa-network-tester
          retention-days: 1

  test-tauri:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.saorsa == 'true' || github.event_name == 'pull_request'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: apps/saorsa/package-lock.json
          
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          
      - name: Test Tauri app
        run: |
          cd apps/saorsa
          npm install
          cargo tauri build --debug

  deploy-macos:
    runs-on: macos-14
    needs: [changes, test-tauri]
    if: |
      (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || 
       (github.ref == 'refs/heads/main' && needs.changes.outputs.saorsa == 'true')) &&
      (github.event.inputs.platform == 'desktop' || github.event.inputs.platform == 'macos' || github.event.inputs.platform == '')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: apps/saorsa/package-lock.json
          
      - name: Build Tauri app for macOS
        run: |
          cd apps/saorsa
          npm install
          cargo tauri build
          
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: saorsa-macos
          path: |
            apps/saorsa/src-tauri/target/release/bundle/
          retention-days: 7

  deploy-linux:
    runs-on: ubuntu-latest
    needs: [changes, test-tauri]
    if: |
      (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || 
       (github.ref == 'refs/heads/main' && needs.changes.outputs.saorsa == 'true')) &&
      (github.event.inputs.platform == 'desktop' || github.event.inputs.platform == 'linux' || github.event.inputs.platform == '')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: apps/saorsa/package-lock.json
          
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          
      - name: Build Tauri app for Linux
        run: |
          cd apps/saorsa
          npm install
          cargo tauri build
          
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: saorsa-linux
          path: |
            apps/saorsa/src-tauri/target/release/bundle/
          retention-days: 7

  cleanup:
    runs-on: ubuntu-latest
    needs: [deploy-macos, deploy-linux, build-terminal-apps]
    if: always()
    
    steps:
      - name: Cleanup artifacts
        if: always()
        run: |
          echo "Deployment completed"