name: Release Desktop App

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (leave empty to use version from tauri.conf.json)'
        required: false
        type: string

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
      release_upload_url: ${{ steps.create-release.outputs.upload_url }}
      release_version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Get app version
        id: get-version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep '"version"' apps/desktop-tauri/src-tauri/tauri.conf.json | cut -d '"' -f 4 | head -n 1)
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi
      
      - name: Check if release exists
        id: check-release
        run: |
          if gh release view "app-v${{ steps.get-version.outputs.version }}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            RELEASE_ID=$(gh api /repos/${{ github.repository }}/releases/tags/app-v${{ steps.get-version.outputs.version }} --jq '.id')
            echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create release
        id: create-release
        if: steps.check-release.outputs.exists != 'true'
        run: |
          RELEASE_RESPONSE=$(gh api /repos/${{ github.repository }}/releases \
            --method POST \
            --field tag_name="app-v${{ steps.get-version.outputs.version }}" \
            --field name="Saorsa Desktop v${{ steps.get-version.outputs.version }}" \
            --field body="## What's New

          ### 🎯 Highlights
          - Desktop application release for Windows, macOS, and Linux
          - Built with Tauri for native performance
          - Includes P2P networking capabilities

          ### 📦 Installation

          Download the appropriate installer for your platform below:
          - **Windows**: Use the `.msi` or `.exe` installer
          - **macOS**: Use the `.dmg` installer (Intel or Apple Silicon)
          - **Linux**: Choose `.AppImage`, `.deb`, or `.rpm` based on your distribution

          ### 🔧 System Requirements
          - Windows 10/11 (64-bit)
          - macOS 10.15 or later
          - Linux: Ubuntu 20.04+ or equivalent

          ---
          *This is an automated release. Please report any issues.*" \
            --field draft=true \
            --field prerelease=false)
          
          echo "id=$(echo $RELEASE_RESPONSE | jq -r '.id')" >> $GITHUB_OUTPUT
          echo "upload_url=$(echo $RELEASE_RESPONSE | jq -r '.upload_url')" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            rust_target: 'aarch64-apple-darwin'
            name: 'macOS (Apple Silicon)'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            rust_target: 'x86_64-apple-darwin'
            name: 'macOS (Intel)'
          - platform: 'ubuntu-22.04'
            args: ''
            rust_target: 'x86_64-unknown-linux-gnu'
            name: 'Linux'
          - platform: 'windows-latest'
            args: ''
            rust_target: 'x86_64-pc-windows-msvc'
            name: 'Windows'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: apps/desktop-tauri/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop-tauri/src-tauri -> target'
          cache-targets: 'false'
          key: ${{ matrix.platform }}-${{ matrix.rust_target }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install frontend dependencies
        run: |
          cd apps/desktop-tauri
          npm ci

      - name: Build frontend
        run: |
          cd apps/desktop-tauri
          npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop-tauri
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: app-v${{ needs.create-release.outputs.release_version }}
          releaseName: 'Saorsa Desktop v${{ needs.create-release.outputs.release_version }}'
          args: ${{ matrix.args }}

      - name: Upload additional artifacts
        if: matrix.platform == 'macos-latest'
        run: |
          # Upload .app bundle as well
          cd apps/desktop-tauri/src-tauri/target/*/release/bundle/macos
          if [ -d "Saorsa.app" ]; then
            zip -r Saorsa-${{ matrix.rust_target }}.app.zip Saorsa.app
            gh release upload app-v${{ needs.create-release.outputs.release_version }} \
              Saorsa-${{ matrix.rust_target }}.app.zip \
              --clobber
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    needs: [create-release, build-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        run: |
          gh api /repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.release_id }} \
            --method PATCH \
            --field draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}