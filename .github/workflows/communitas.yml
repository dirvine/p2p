name: Communitas CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/communitas/**'
      - '.github/workflows/communitas.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/communitas/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Communitas
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      
    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-communitas-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Build
      run: |
        cd apps/communitas
        cargo build --release --all-features
        
    - name: Test
      run: |
        cd apps/communitas
        cargo test --all-features
        
    - name: Clippy
      run: |
        cd apps/communitas
        cargo clippy --all-features -- -D warnings
        
    - name: Format check
      run: |
        cd apps/communitas
        cargo fmt -- --check

