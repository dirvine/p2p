name: Communitas CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/communitas/**'
      - '.github/workflows/communitas.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/communitas/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Communitas
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Checkout four-word-networking dependency
      uses: actions/checkout@v4
      with:
        repository: dirvine/four-word-networking
        path: ../four-word-networking
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install protoc
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler
        
    - name: Install system dependencies
      run: |
        sudo apt-get install -y build-essential pkg-config libssl-dev \
          libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
          librsvg2-dev libglib2.0-dev
      
    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-communitas-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Build
      run: |
        cd apps/communitas
        cargo build --release --all-features
        
    - name: Test
      run: |
        cd apps/communitas
        cargo test --all-features
        
    - name: Clippy
      run: |
        cd apps/communitas
        cargo clippy --all-features -- -W clippy::correctness -W clippy::suspicious -A warnings
        
    - name: Format check
      run: |
        cd apps/communitas
        cargo fmt -- --check

  # Tauri build will be added in Task 2
