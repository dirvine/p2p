[package]
name = "licensing-examples"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later OR Commercial"

[[bin]]
name = "agpl-compliance"
path = "agpl-compliance.rs"

[[bin]]
name = "commercial-integration"
path = "commercial-integration.rs"

[[bin]]
name = "license-migration"
path = "license-migration.rs"

[dependencies]
p2p-foundation = { path = "../.." }
ant-core = { path = "../../crates/p2p-core" }
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
warp = "0.3"  # For web server example
dirs = "5.0"

[features]
commercial = []