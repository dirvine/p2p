# P2P Foundation Configuration Example
# This file shows all available configuration options with their default values

[network]
# Bootstrap nodes for network discovery
bootstrap_nodes = []
# Local listen address (0.0.0.0:9000 for all interfaces)
listen_address = "0.0.0.0:9000"
# Public address for external connections (auto-detected if not set)
# public_address = "1.2.3.4:9000"
# Enable IPv6 support
ipv6_enabled = true
# Maximum concurrent connections
max_connections = 10000
# Connection timeout in seconds
connection_timeout = 30
# Keepalive interval in seconds
keepalive_interval = 60

[security]
# Rate limit (requests per second)
rate_limit = 1000
# Connection limit per IP
connection_limit = 100
# Enable TLS/encryption
encryption_enabled = true
# Minimum TLS version
min_tls_version = "1.3"
# Security level for identity management
identity_security_level = "High"

[storage]
# Base path for data storage
path = "./data"
# Maximum storage size
max_size = "10GB"
# Cache size in MB
cache_size = 256
# Enable compression
compression_enabled = true

[mcp]
# Enable MCP server
enabled = true
# MCP server port
port = 9001
# Maximum tool execution time in seconds
max_execution_time = 300
# Enable resource monitoring
monitoring_enabled = true

[dht]
# Replication factor (K value)
replication_factor = 8
# Alpha value for parallel queries
alpha = 3
# Beta value for routing
beta = 1
# Record TTL in seconds
record_ttl = 3600
# Enable adaptive routing
adaptive_routing = true

[transport]
# Preferred transport protocol
protocol = "quic"
# Enable QUIC transport
quic_enabled = true
# Enable TCP transport
tcp_enabled = true
# Enable WebRTC transport
webrtc_enabled = false
# Transport buffer size
buffer_size = 65536

[identity]
# Default key derivation path
derivation_path = "m/44'/0'/0'/0/0"
# Key rotation interval in days
rotation_interval = 90
# Enable automatic backups
backup_enabled = true
# Backup interval in hours
backup_interval = 24