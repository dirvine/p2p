# Saorsa P2P Network Configuration - Production Profile
# Optimized for production deployments

[network]
# Production bootstrap nodes
bootstrap_nodes = [
    "bootstrap1.saorsa.network:9000",
    "bootstrap2.saorsa.network:9000",
    "bootstrap3.saorsa.network:9000",
    "bootstrap4.saorsa.network:9000",
]
listen_address = "0.0.0.0:9000"
ipv6_enabled = true
max_connections = 50000
connection_timeout = 30
keepalive_interval = 60

[security]
# Strict security settings
rate_limit = 1000
connection_limit = 100
encryption_enabled = true
min_tls_version = "1.3"
identity_security_level = "High"

[storage]
# Production storage settings
path = "/var/lib/saorsa"
max_size = "100GB"
cache_size = 1024
compression_enabled = true

[mcp]
enabled = true
port = 9001
max_execution_time = 300
monitoring_enabled = true

[dht]
# Production DHT parameters
replication_factor = 8
alpha = 3
beta = 1
record_ttl = 3600
adaptive_routing = true

[transport]
# QUIC for optimal performance
protocol = "quic"
quic_enabled = true
tcp_enabled = true
webrtc_enabled = false
buffer_size = 131072

[identity]
derivation_path = "m/44'/0'/0'/0/0"
rotation_interval = 90
backup_enabled = true
backup_interval = 24