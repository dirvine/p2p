# P2P Foundation Development Configuration
# Optimized for local development and testing

[network]
# Local development bootstrap nodes
bootstrap_nodes = ["127.0.0.1:9000", "127.0.0.1:9001", "127.0.0.1:9002"]
# Listen on localhost only for development
listen_address = "127.0.0.1:9000"
# Lower limits for development
max_connections = 100
connection_timeout = 10
keepalive_interval = 30

[security]
# Higher rate limits for development
rate_limit = 10000
connection_limit = 1000
# Can disable encryption for local testing
encryption_enabled = false
min_tls_version = "1.2"
identity_security_level = "Medium"

[storage]
# Development data directory
path = "./dev-data"
# Smaller storage for development
max_size = "1GB"
cache_size = 64
compression_enabled = false

[mcp]
enabled = true
port = 9001
max_execution_time = 60
monitoring_enabled = true

[dht]
# Smaller values for faster development testing
replication_factor = 3
alpha = 2
beta = 1
record_ttl = 300
adaptive_routing = true

[transport]
protocol = "tcp"
quic_enabled = false
tcp_enabled = true
webrtc_enabled = false
buffer_size = 32768

[identity]
derivation_path = "m/44'/0'/0'/0/0"
rotation_interval = 365
backup_enabled = false
backup_interval = 24